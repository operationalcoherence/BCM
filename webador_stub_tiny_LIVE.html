<div id="gsm-mount"></div>
<script>
(function () {
  /* Paste this into the Webador Embed Code block ONCE. Nothing here ever
     changes again. The workbook itself lives at the address below. Your Esri
     key stays on this page and never goes into the repository. */
  window.GSM_ESRI_KEY = "PUT-YOUR-ESRI-KEY-HERE";
  var REPO = "https://operationalcoherence.github.io/BCM/";
  var s = document.createElement("script");
  s.src = REPO + "gsm.js?t=" + Math.floor(Date.now() / 60000);
  s.onerror = function () {
    document.getElementById("gsm-mount").innerHTML =
      '<div style="padding:10px;border:1px solid #c33;color:#c33;font:13px sans-serif">'
      + 'The workbook could not load from ' + REPO + '</div>';
  };
  document.body.appendChild(s);
})();
</script>
